services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: resqiva
      POSTGRES_USER: resqiva
      POSTGRES_PASSWORD: resqiva
    ports:
      - "5432:5432"
    volumes:
      - resqiva_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resqiva -d resqiva"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  resqiva_postgres:
