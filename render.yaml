services:
  - type: web
    name: resqiva
    runtime: node
    plan: free
    region: frankfurt
    branch: work
    buildCommand: npm ci && npm run build
    startCommand: npm run db:deploy && npm run db:seed && npm start
    autoDeployTrigger: "off"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resqiva-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENABLE_DEMO_LOGIN
        value: "true"
      - key: AI_PROVIDER
        value: fireworks
      - key: AI_MODEL
        value: accounts/fireworks/models/deepseek-v4p1-flash-1017

databases:
  - name: resqiva-db
    databaseName: resqiva_db
    user: resqiva_db_user
    postgresMajorVersion: "18"
    plan: free
    region: frankfurt
