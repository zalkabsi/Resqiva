services:
  - type: web
    name: resqiva
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    branch: work
    buildCommand: npm ci && npm run build
    startCommand: npm run db:deploy && npm start
    initialDeployHook: npm run db:seed
    autoDeployTrigger: "off"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resqiva-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENABLE_DEMO_LOGIN
        value: "true"
      - key: AI_PROVIDER
        value: fireworks
      - key: AI_MODEL
        value: accounts/fireworks/models/deepseek-v4p1-flash-1017
      - key: FIREWORKS_API_KEY
        sync: false

databases:
  - name: resqiva-db
    databaseName: resqiva
    user: resqiva
    plan: 0.1c-256mb
    region: frankfurt
